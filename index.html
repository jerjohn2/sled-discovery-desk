<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SLED Discovery Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%231c4654' width='16' height='16' rx='3'/%3E%3C/svg%3E" />
  <style>
:root {
  --ink: #1a242b;
  --ink-soft: #4a5c66;
  --muted: #6d7c84;
  --paper: #efeae1;
  --sheet: #fbf8f2;
  --white: #fffcf7;
  --teal: #1c4654;
  --teal-2: #2a6574;
  --line: #d9d1c4;
  --line-strong: #c3b9a8;
  --amber: #8d4e22;
  --amber-soft: #f3e4d4;
  --green: #234838;
  --green-soft: #e4efe8;
  --rose: #6e3344;
  --shadow: 0 18px 40px rgba(28, 40, 46, 0.08);
  --sans: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --serif: "Newsreader", "Iowan Old Style", Palatino, serif;
  --vis: #1d6a78;
  --ctl: #8a4b24;
  --res: #6b3a4a;
  --ux: #2d5a3d;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(1200px 400px at 10% -10%, rgba(42, 101, 116, 0.08), transparent 50%),
    var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 380;
  letter-spacing: 0.01em;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

.top {
  display: grid;
  grid-template-columns: minmax(180px, 240px) 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: rgba(251, 248, 242, 0.92);
  position: sticky;
  top: 0;
  z-index: 5;
  backdrop-filter: blur(8px);
}
.brand { display: flex; gap: 12px; align-items: center; }
.mark {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background:
    linear-gradient(var(--teal), var(--teal)) 4px 14px / 20px 3px no-repeat,
    linear-gradient(var(--amber), var(--amber)) 4px 8px / 12px 3px no-repeat,
    #e7efe9;
  border: 1px solid #c5d5cc;
}
.brand-kicker {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.brand h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 620;
  font-size: 22px;
  letter-spacing: -0.02em;
}
.steps { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.steps button {
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 7px 12px;
}
.steps button[aria-current="step"] {
  background: var(--teal);
  color: #f4f7f6;
}
.steps button:hover { border-color: var(--line-strong); }
.steps button[aria-current="step"]:hover { border-color: var(--teal); }
.top-meta { display: flex; align-items: center; gap: 10px; }
.save-state { margin: 0; color: var(--muted); font-size: 13px; min-width: 88px; text-align: right; }
.meeting-switch select, .text-btn, .btn, .btn-ghost, .field input, .field select, .field textarea, .search input {
  border: 1px solid var(--line-strong);
  background: var(--white);
  border-radius: 8px;
}
.meeting-switch select { padding: 7px 10px; width: 280px; max-width: 34vw; }
.text-btn, .btn, .btn-ghost {
  padding: 8px 12px;
  background: var(--white);
}
.btn-primary, .btn.primary {
  background: var(--teal);
  color: #f6faf8;
  border-color: var(--teal);
}
.btn-amber { background: var(--amber); color: #fffaf5; border-color: var(--amber); }
.btn:disabled, .text-btn:disabled { opacity: 0.45; cursor: not-allowed; }

.stage { padding: 22px; max-width: 1180px; margin: 0 auto; }
.layout { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; align-items: start; }
.panel {
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 18px 16px;
  box-shadow: var(--shadow);
}
.panel h2, .block-title {
  font-family: var(--serif);
  font-weight: 620;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
}
.lede { margin: 0 0 14px; color: var(--ink-soft); line-height: 1.45; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field span, .label {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.field input, .field select, .field textarea, .bullet-row input, .prompt-box textarea {
  padding: 9px 10px;
  width: 100%;
}
.field textarea { min-height: 74px; resize: vertical; line-height: 1.4; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill, .chip {
  border: 1px solid var(--line-strong);
  background: var(--white);
  border-radius: 999px;
  padding: 6px 10px;
  color: var(--ink-soft);
}
.pill[aria-pressed="true"] {
  background: var(--teal);
  color: #f4f8f6;
  border-color: var(--teal);
}
.rules { margin: 0; padding-left: 18px; color: var(--ink-soft); }
.rules li { margin: 0 0 8px; line-height: 1.4; }
.starter { padding: 10px 0; border-top: 1px solid var(--line); }
.starter p { margin: 4px 0; line-height: 1.4; }
.meta-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 3px 7px;
  background: #ece7dc;
  color: var(--ink-soft);
}
.tag.vis { background: #e5f2f4; color: var(--vis); }
.tag.ctl { background: var(--amber-soft); color: var(--ctl); }
.tag.res { background: #f6e8ec; color: var(--res); }
.tag.ux { background: var(--green-soft); color: var(--ux); }
.tag.guide { background: #efe6c8; color: #6d5414; }
.tag.bank { background: #e7eef2; color: var(--teal); }
.tag.role { background: #ece7f2; color: #4c3d68; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filters input, .filters select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--white); }
.filters input { flex: 1; min-width: 180px; }
.domain-block { margin-bottom: 16px; }
.domain-block h3 {
  margin: 0 0 8px;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.topic-card, .q-card, .arc-card {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 12px;
  padding: 12px;
}
.topic-card h4, .q-card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
.topic-card p, .quiet { margin: 0; color: var(--ink-soft); line-height: 1.4; font-size: 14px; }
.topic-card.centered { border-color: var(--teal-2); box-shadow: inset 3px 0 0 var(--teal-2); }
.q-card { margin-bottom: 10px; border-left: 4px solid var(--line-strong); }
.q-card.vis { border-left-color: var(--vis); }
.q-card.ctl { border-left-color: var(--ctl); }
.q-card.res { border-left-color: var(--res); }
.q-card.ux { border-left-color: var(--ux); }
.q-text { font-family: var(--serif); font-size: 18px; line-height: 1.35; margin: 8px 0; }
.listen { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.listen span, .signal {
  background: #f3efe6;
  border-radius: 6px;
  padding: 4px 7px;
  font-size: 13px;
  color: var(--ink-soft);
}
.internal {
  margin-top: 8px;
  padding: 8px 10px;
  background: #f6f1e6;
  border-radius: 8px;
  color: var(--ink-soft);
  font-size: 13px;
}
.internal strong { color: var(--amber); font-weight: 500; }

.arc-list { display: flex; flex-direction: column; gap: 8px; }
.arc-card { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; }
.seq-no {
  font-family: var(--serif);
  font-size: 22px;
  color: var(--teal);
}
.balance {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 8px 0 14px;
}
.balance span {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 13px;
}
.warn {
  background: var(--amber-soft);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--amber);
  margin-bottom: 12px;
}
.ok-note {
  background: var(--green-soft);
  color: var(--green);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 12px;
}

.live {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 16px;
}
.live-side button.jump {
  display: block;
  width: 100%;
  text-align: left;
  margin-bottom: 6px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--white);
  padding: 8px 10px;
}
.live-side button.jump[aria-current="true"] { border-color: var(--teal); background: #eef5f6; }
.live-card .q-text { font-size: 28px; }
.signal-btn { }
.signal-btn[aria-pressed="true"] { background: var(--teal); color: white; }

.sheet-wrap { display: grid; grid-template-columns: 250px 1fr; gap: 16px; align-items: start; }
.sheet {
  background: var(--sheet);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.sheet-top {
  display: block;
  border-bottom: 2px solid var(--teal);
  padding-bottom: 10px;
  margin-bottom: 10px;
}
.sheet-kicker { margin: 0; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
.sheet h2 { font-family: var(--serif); font-size: 32px; margin: 0; font-weight: 620; }
.sheet-contact { max-width: none; margin-top: 8px; }
.issue-block { margin: 8px 0 10px; }
.issue-block textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 8px;
  padding: 8px 10px;
  min-height: 64px;
  line-height: 1.4;
}
.issue-block.anxiety textarea { border-color: #e2c7b0; background: #fffaf6; }
.sheet-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.cell {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  background: #fffcf8;
  min-height: 180px;
}
.cell h3 {
  margin: 0 0 8px;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
  color: var(--teal);
}
.stack-pair { display: flex; flex-direction: column; gap: 10px; }
.bullet-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: start; }
.bullet-row input, .bullet-row textarea {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 7px 8px;
  background: white;
  line-height: 1.35;
}
.bullet-row textarea { resize: vertical; min-height: 48px; }
.icon-btn {
  border: 1px solid var(--line);
  background: white;
  border-radius: 7px;
  width: 32px;
}
.subhead { margin: 8px 0 4px; font-size: 13px; color: var(--ink-soft); }
.opc { display: flex; gap: 6px; margin-top: 8px; }
.opc button {
  flex: 1;
  border: 0;
  border-radius: 7px;
  padding: 6px 4px;
  background: #d5e2e4;
  color: var(--teal);
  letter-spacing: 0.08em;
  font-size: 11px;
}
.opc button[aria-expanded="true"] { background: var(--teal); color: white; }
.prompt-box textarea { min-height: 58px; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; }
.coach { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
.mode-banner { margin-bottom: 10px; }

.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--ink);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  max-width: 320px;
}
.sources { font-size: 13px; color: var(--ink-soft); }
.sources a { color: var(--teal-2); }
.empty { padding: 20px; color: var(--ink-soft); }
.sheet-tools .btn { display: block; width: 100%; margin: 0 0 8px; text-align: left; }

@media (max-width: 980px) {
  .top { grid-template-columns: 1fr; }
  .layout, .live, .sheet-wrap, .topic-grid, .grid-2, .sheet-grid { grid-template-columns: 1fr; }
  .live-card .q-text { font-size: 22px; }
  .top-meta { justify-content: space-between; }
}

@media print {
  .top, .toast, .noprint, .sheet-tools { display: none !important; }
  body { background: white; }
  .stage { max-width: none; padding: 0; }
  .sheet { box-shadow: none; border: 0; }
  .sheet-wrap { display: block; }
}

  </style>
</head>

  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <p class="brand-kicker">Cisco SLED · internal</p>
        <h1>Discovery Desk</h1>
      </div>
    </div>
    <nav class="steps" aria-label="Workspace steps">
      <button type="button" data-step="brief" aria-current="step">Brief</button>

      <button type="button" data-step="live">Live notes</button>
      <button type="button" data-step="prompter">ValuePrompter</button>

    <div class="top-meta">
      <p class="save-state" id="saveState">Not saved yet</p>

        <span class="sr">Open a meeting</span>

      </label>
      <button type="button" class="text-btn" id="newMeeting">New</button>

  </header>
  <main class="stage" id="stage">
    <section class="panel">
      <h2>SLED Discovery Desk</h2>
      <p class="lede">If this note is still here, open this file in Chrome, Edge, or Safari. A code preview shows a blank page because it does not run the workspace.</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    window.addEventListener("error", function (event) {
      var stage = document.getElementById("stage");
      if (!stage || !event) return;
      var box = document.createElement("p");
      box.className = "warn";
      box.textContent = "The desk stopped: " + (event.message || "unknown error");
      stage.prepend(box);
    });
  </script>

  };

  let store = loadStore();
  let meeting = store.meetings[0] || blankMeeting();
  if (!store.meetings.length) store.meetings.push(meeting);

  const stage = document.getElementById("stage");
  const toastEl = document.getElementById("toast");

  document.querySelectorAll(".steps button").forEach((btn) => {
    btn.addEventListener("click", () => {
      ui.step = btn.dataset.step;
      render();
    });
  });
  document.getElementById("newMeeting").addEventListener("click", () => {
    meeting = blankMeeting();
    store.meetings.unshift(meeting);
    ui.step = "brief";
    save();
    render();
  });
  document.getElementById("meetingSwitch").addEventListener("change", (e) => {
    const next = store.meetings.find((m) => m.id === e.target.value);
    if (next) {
      meeting = next;
      ui.step = "brief";
      ui.liveIndex = 0;
      render();
    }
  });

  try {
    if (!PB || !PB.topics || !PB.topics.length) {
      showBootError("The question bank did not load. Open SLED-Discovery-Desk.html in Chrome, Edge, or Safari. The editor preview leaves this page blank.");
    } else {
      render();
    }
  } catch (err) {
    showBootError(err && err.message ? err.message : String(err));
  }

  function showBootError(message) {
    if (!stage) return;
    stage.innerHTML = "";
    const panel = document.createElement("section");
    panel.className = "panel";
    const title = document.createElement("h2");
    title.textContent = "Discovery Desk could not start";
    const body = document.createElement("p");
    body.textContent = message;
    panel.append(title, body);
    stage.appendChild(panel);
  }

  function blankMeeting() {
    return {
      id: "m_" + Math.random().toString(36).slice(2, 10),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      account: "",
      segment: "K-12",
      contactName: "",
      contactTitle: "",
      role: "CIO",
      triggers: [],
      outcome: "",
      meetingDate: "",
      accountNotes: "",
      focusTopicIds: [],
      arc: [],
      prompter: blankPrompter()
    };
  }

  function blankPrompter() {
    return {
      mode: "",
      contact: "",
      businessIssue: "",
      anxiety: "",
      problems: [""],
      uniqueProblems: [""],
      solutions: [""],
      uniqueSolutions: [""],
      businessValue: [""],
      uniqueValue: [""],
      personalValue: [""],
      players: [""],
      events: [""],
      prompts: {
        problem: { open: "", probe: "", confirm: "" },
        solution: { open: "", probe: "", confirm: "" },
        value: { open: "", probe: "", confirm: "" },
        power: { open: "", probe: "", confirm: "" },
        plan: { open: "", probe: "", confirm: "" }
      },
      internal: []
    };
  }

  function loadStore() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { meetings: [] };
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.meetings)) return { meetings: [] };
      return data;
    } catch (err) {
      return { meetings: [] };
    }
  }

  function save() {
    meeting.updatedAt = Date.now();
    const idx = store.meetings.findIndex((m) => m.id === meeting.id);
    if (idx === -1) store.meetings.unshift(meeting);
    else store.meetings[idx] = meeting;
    const el = document.getElementById("saveState");
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
      if (el) el.textContent = "Saved on this browser";
    } catch (err) {
      if (el) el.textContent = "This browser will not store the meeting";
    }
  }

  function toast(msg) {
    toastEl.hidden = false;
    toastEl.textContent = msg;
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => { toastEl.hidden = true; }, 2800);
  }

  function topicById(id) {
    return PB.topics.find((t) => t.id === id);
  }

  function pillarClass(pillar) {
    if (pillar === "Visibility") return "vis";
    if (pillar === "Control") return "ctl";
    if (pillar === "Resilience") return "res";
    if (pillar === "User Experience") return "ux";
    return "";
  }

  function guidesFor(topic) {
    const window = windowPhrase(meeting.triggers, meeting.segment);
    return [
      {
        id: topic.id + "-g-tech-vis",
        source: "guide",
        layer: "Technical",
        pillar: "Visibility",
        role: "Technical owner",
        context: "Operating reality",
        question: "Across " + topic.scope + ", where is the picture of " + topic.capability + " still fragmented, and what do your teams use when that view is missing?",
        listen: "Swivel-chair tools; visibility that stops at a site, school, or agency boundary; no shared baseline",
        follow: "Which boundary hides the most important context when something is already failing?",
        align: topic.alignment,
        use: "After they name a priority. Ask for the operating picture, not a tool tour."
      },
      {
        id: topic.id + "-g-tech-ctl",
        source: "guide",
        layer: "Technical",
        pillar: "Control",
        role: "Technical owner",
        context: "Operating reality",
        question: "Today, how do " + topic.accountability + " actually get decided and enforced, and where do ownership boundaries or exceptions break that?",
        listen: "Policy without enforcement; local exceptions; tools that do not share a decision",
        follow: "Walk me through the last exception. Who approved it, and does it expire?",
        align: topic.alignment,
        use: "When accountability is unclear and you need the working reality."
      },
      {
        id: topic.id + "-g-imp-res",
        source: "guide",
        layer: "Impact",
        pillar: "Resilience",
        role: meeting.role || "CIO",
        context: "Cost of the gap",
        question: "When " + topic.capability + " fails, what is the real cost across staff time, constituent or student access, compliance exposure, downtime, and public trust?",
        listen: "Uncounted cost; equity gaps between sites; downtime that becomes a public story",
        follow: "Who feels that cost first, and who has to explain it?",
        align: topic.alignment,
        use: "Connect the technical gap to risk, cost, equity, downtime, or trust."
      },
      {
        id: topic.id + "-g-imp-ux",
        source: "guide",
        layer: "Impact",
        pillar: "User Experience",
        role: meeting.role || "Superintendent",
        context: "Service equity",
        question: "Among " + topic.personas + ", who feels the friction most, and how does that show up in service equity or trust?",
        listen: "Different outcomes by site or user group; workarounds; low adoption; access barriers",
        follow: "How is that experience measured today, if it is measured at all?",
        align: topic.alignment,
        use: "When the room cares about people, not components."
      },
      {
        id: topic.id + "-g-dec",
        source: "guide",
        layer: "Decision",
        pillar: "Control",
        role: meeting.role || "CIO",
        context: "Decision window",
        question: "What evidence would make a decision about " + topic.capability + " defensible before " + window + "?",
        listen: "Anecdotes; a decision that cannot be shown to finance or a board",
        follow: "What date is real, and what has to be true before that date?",
        align: topic.alignment,
        use: "Close the arc on evidence, timing, and the mutual plan."
      }
    ];
  }

  function questionPool() {
    const bank = [];
    PB.topics.forEach((t) => {
      t.questions.forEach((q) => bank.push(Object.assign({ topicId: t.id, technology: t.technology, domain: t.domain }, q)));
      guidesFor(t).forEach((g) => bank.push(Object.assign({ topicId: t.id, technology: t.technology, domain: t.domain }, g)));
    });
    PB.starters.forEach((s) => bank.push(Object.assign({ topicId: "", technology: "Role opening", domain: "Role starters" }, s)));
    return bank;
  }

  function inArc(id) {
    return meeting.arc.some((a) => a.sourceId === id);
  }

  function addToArc(q) {
    if (inArc(q.id)) return;
    meeting.arc.push({
      uid: "a_" + Math.random().toString(36).slice(2, 9),
      sourceId: q.id,
      source: q.source,
      topicId: q.topicId || "",
      domain: q.domain || "",
      technology: q.technology || "",
      layer: q.layer,
      pillar: q.pillar,
      role: q.role || "",
      context: q.context || "",
      question: q.question,
      listen: q.listen || "",
      follow: q.follow || "",
      align: q.align || "",
      use: q.use || "",
      evidence: "",
      signals: [],
      unique: false,
      followup: q.follow || ""
    });
    save();
    toast("Added to the arc");
    render();
  }

  function render() {
    document.querySelectorAll(".steps button").forEach((btn) => {
      btn.setAttribute("aria-current", btn.dataset.step === ui.step ? "step" : "false");
    });
    const saveEl = document.getElementById("saveState");
    if (saveEl) {
      var alreadySaved = false;
      try { alreadySaved = !!localStorage.getItem(KEY); } catch (err) { alreadySaved = false; }
      saveEl.textContent = alreadySaved ? "Saved on this browser" : "Not saved yet";
    }
    const sw = document.getElementById("meetingSwitch");
    sw.innerHTML = "";
    store.meetings.forEach((m) => {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.account || "Untitled meeting";
      if (m.id === meeting.id) opt.selected = true;
      sw.appendChild(opt);
    });
    const scroll = stage.scrollTop;
    stage.innerHTML = "";
    if (ui.step === "brief") stage.appendChild(viewBrief());
    if (ui.step === "playbook") stage.appendChild(viewPlaybook());
    if (ui.step === "arc") stage.appendChild(viewArc());
    if (ui.step === "live") stage.appendChild(viewLive());
    if (ui.step === "prompter") stage.appendChild(viewPrompter());
    stage.scrollTop = scroll;
  }

  function viewBrief() {
    const wrap = el("div", { class: "layout" });
    const form = el("section", { class: "panel" });
    form.append(
      el("h2", {}, "Meeting brief"),
      el("p", { class: "lede" }, "Set the account, the person in the room, and the pressure on the decision. The playbook starts from their problem, not from a product.")
    );
    form.appendChild(field("Account", "text", meeting.account, (v) => { meeting.account = v; save(); }, "Rivergate Unified School District"));
    form.appendChild(pillField("SLED segment", SEGMENTS, meeting.segment, (v) => { meeting.segment = v; save(); render(); }));
    const names = el("div", { class: "grid-2" });
    names.append(
      field("Contact name", "text", meeting.contactName, (v) => { meeting.contactName = v; save(); }, "Elena Vasquez"),
      field("Title", "text", meeting.contactTitle, (v) => { meeting.contactTitle = v; save(); }, "Chief Technology Officer")
    );
    form.appendChild(names);
    form.appendChild(pillField("Primary role", ROLES, meeting.role, (v) => { meeting.role = v; save(); render(); }));
    form.appendChild(multiField("Known triggers", TRIGGERS, meeting.triggers, (list) => { meeting.triggers = list; save(); }));
    form.appendChild(areaField("Desired customer outcome", meeting.outcome, (v) => { meeting.outcome = v; save(); }, "What they need to be true for students, constituents, or the mission."));
    form.appendChild(field("Meeting date", "date", meeting.meetingDate, (v) => { meeting.meetingDate = v; save(); }));
    form.appendChild(areaField("What you already know", meeting.accountNotes, (v) => { meeting.accountNotes = v; save(); }, "Incidents, politics, funding rumors. Keep this on your side of the table."));
    const actions = el("div", { class: "row-actions" });
    actions.append(
      button("Open the playbook", "primary", () => { ui.step = "playbook"; render(); }),
      button("Load Rivergate walkthrough", "", loadSample),
      button("Delete this meeting", "", deleteMeeting)
    );
    form.appendChild(actions);

    const side = el("aside", { class: "panel" });
    side.append(
      el("h2", {}, "How to run it"),
      el("ol", { class: "rules" }, PB.meta.rules.map((r) => el("li", {}, r)))
    );
    side.append(el("h3", { class: "block-title", style: "margin-top:16px" }, meeting.role + " opening"));
    side.append(el("p", { class: "quiet" }, "Use one of these to establish relevance, then bridge into a technology topic."));
    PB.starters.filter((s) => s.role === meeting.role).forEach((s) => {
      const box = el("div", { class: "starter" });
      box.append(
        el("div", { class: "meta-row" }, tag(s.layer, ""), tag(s.pillar, pillarClass(s.pillar))),
        el("p", {}, s.question)
      );
      const add = button(inArc(s.id) ? "In the arc" : "Add to arc", "", () => addToArc(Object.assign({ domain: "Role starters", technology: "Role opening", topicId: "" }, s)));
      add.disabled = inArc(s.id);
      box.appendChild(add);
      side.appendChild(box);
    });
    side.append(el("h3", { class: "block-title", style: "margin-top:16px" }, "Value pillars"));
    Object.keys(PB.meta.pillars).forEach((name) => {
      side.append(el("p", { class: "quiet" }, name + " — " + PB.meta.pillars[name]));
    });
    wrap.append(form, side);
    return wrap;
  }

  function viewPlaybook() {
    const wrap = el("div", {});
    const head = el("section", { class: "panel", style: "margin-bottom:14px" });
    head.append(
      el("h2", {}, "Playbook"),
      el("p", { class: "lede" }, PB.topics.length + " topics. " + PB.meta.questionBankCount + " strategic questions from the question bank, plus role starters. Arc guides fill the technical, impact, and decision layers from each topic’s own language. Center one or two topics, then add 5–7 questions.")
    );
    const filters = el("div", { class: "filters" });
    const search = document.createElement("input");
    search.type = "search";
    search.placeholder = "Search questions, topics, or listen-fors";
    search.value = ui.query;
    search.setAttribute("aria-label", "Search the playbook");
    search.addEventListener("input", () => {
      ui.query = search.value;
      const caret = search.selectionStart;
      render();
      const next = document.querySelector(".filters input[type='search']");
      if (next) {
        next.focus();
        if (caret != null) next.setSelectionRange(caret, caret);
      }
    });
    filters.appendChild(search);
    filters.appendChild(selectFilter("Domain", ["All"].concat(DOMAINS).concat(["Role starters"]), ui.domain, (v) => { ui.domain = v; }));
    filters.appendChild(selectFilter("Layer", ["All", "Strategic", "Technical", "Impact", "Decision"], ui.layer, (v) => { ui.layer = v; }));
    filters.appendChild(selectFilter("Pillar", ["All", "Visibility", "Control", "Resilience", "User Experience"], ui.pillar, (v) => { ui.pillar = v; }));
    head.appendChild(filters);
    if (meeting.focusTopicIds.length) {
      const chips = el("div", { class: "meta-row" });
      chips.append(el("span", { class: "quiet" }, "Centered: "));
      meeting.focusTopicIds.forEach((id) => {
        const t = topicById(id);
        if (!t) return;
        chips.append(el("span", { class: "tag" }, t.technology));
      });
      head.appendChild(chips);
    }
    wrap.appendChild(head);

    const q = ui.query.trim().toLowerCase();
    const showQuestions = q || ui.domain === "Role starters" || ui.layer !== "All" || ui.pillar !== "All";
    if (!showQuestions && ui.domain !== "Role starters") {
      DOMAINS.filter((d) => ui.domain === "All" || d === ui.domain).forEach((d) => {
        const block = el("section", { class: "domain-block" });
        const topics = PB.topics.filter((t) => t.domain === d);
        block.append(el("h3", {}, d + " · " + topics.length));
        const grid = el("div", { class: "topic-grid" });
        topics.forEach((t) => grid.appendChild(topicCard(t)));
        block.appendChild(grid);
        wrap.appendChild(block);
      });
    } else {
      const list = el("div", {});
      const matches = filteredQuestions();
      list.append(el("p", { class: "quiet", style: "margin-bottom:10px" }, matches.length + " questions"));
      if (!matches.length) list.append(el("p", { class: "empty" }, "Nothing matches. Clear a filter or try a problem word such as staffing, equity, or outage."));
      matches.slice(0, 60).forEach((item) => list.appendChild(questionCard(item)));
      if (matches.length > 60) list.append(el("p", { class: "quiet" }, "Showing the first 60. Narrow the search to see the rest."));
      wrap.appendChild(list);
    }
    const about = el("section", { class: "panel sources", style: "margin-top:16px" });
    about.append(el("h2", {}, "Scope and sources"), el("p", {}, PB.meta.note));
    about.append(el("p", {}, "Compliance prompts are discovery questions, not legal advice. Confirm the customer’s own obligations before you make a claim. Spoken questions do not name Cisco products."));
    const ul = el("ul", {});
    PB.meta.sources.forEach((s) => {
      const a = el("a", { href: s.url, target: "_blank", rel: "noreferrer" }, s.name);
      ul.append(el("li", {}, a, " — " + s.how));
    });
    about.appendChild(ul);
    wrap.appendChild(about);
    return wrap;
  }

  function topicCard(t) {
    const centered = meeting.focusTopicIds.includes(t.id);
    const card = el("article", { class: "topic-card" + (centered ? " centered" : "") });
    card.append(el("h4", {}, t.technology), el("p", {}, t.capability));
    const internal = el("p", { class: "internal" });
    internal.append(el("strong", {}, "Internal alignment. "), "Do not lead with this. ", t.alignment);
    card.appendChild(internal);
    const actions = el("div", { class: "row-actions" });
    actions.append(
      button(centered ? "Centered" : "Center topic", centered ? "primary" : "", () => toggleFocus(t.id)),
      button("View questions", "", () => { ui.query = t.technology; ui.domain = t.domain; render(); })
    );
    card.appendChild(actions);
    return card;
  }

  function toggleFocus(id) {
    const i = meeting.focusTopicIds.indexOf(id);
    if (i >= 0) meeting.focusTopicIds.splice(i, 1);
    else if (meeting.focusTopicIds.length >= 2) {
      toast("Center two topics at most. Remove one first.");
      return;
    } else meeting.focusTopicIds.push(id);
    save();
    render();
  }

  function filteredQuestions() {
    const q = ui.query.trim().toLowerCase();
    return questionPool().filter((item) => {
      if (ui.domain !== "All" && item.domain !== ui.domain) return false;
      if (ui.layer !== "All" && item.layer !== ui.layer) return false;
      if (ui.pillar !== "All" && item.pillar !== ui.pillar) return false;
      if (!q) return true;
      const hay = [item.technology, item.question, item.listen, item.domain, item.pillar, item.align].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }

  function questionCard(item) {
    const card = el("article", { class: "q-card " + pillarClass(item.pillar) });
    const sourceLabel = item.source === "bank" ? "Question bank" : item.source === "role" ? "Role starter" : "Arc guide";
    card.append(el("div", { class: "meta-row" },
      tag(sourceLabel, item.source),
      tag(item.layer, ""),
      tag(item.pillar, pillarClass(item.pillar)),
      el("span", { class: "quiet" }, item.domain + (item.technology ? " · " + item.technology : ""))
    ));
    card.append(el("p", { class: "q-text" }, item.question));
    const listens = el("div", { class: "listen" });
    splitListen(item.listen).forEach((s) => listens.append(el("span", {}, s)));
    card.append(listens);
    card.append(el("p", { class: "quiet" }, "Follow-up: " + item.follow));
    card.append(el("p", { class: "quiet" }, "Use when: " + item.use));
    if (item.align) {
      const internal = el("p", { class: "internal" });
      internal.append(el("strong", {}, "Internal only. "), item.align);
      card.appendChild(internal);
    }
    const add = button(inArc(item.id) ? "In the arc" : "Add to arc", "primary", () => addToArc(item));
    add.disabled = inArc(item.id);
    card.append(el("div", { class: "row-actions" }, add));
    return card;
  }

  function viewArc() {
    const wrap = el("div", {});
    const head = el("section", { class: "panel", style: "margin-bottom:12px" });
    head.append(
      el("h2", {}, "Conversation arc"),
      el("p", { class: "lede" }, "Plan 5–7 questions: 2 strategic, 2–3 technical, 1–2 impact, then one decision question. Read them in their language. Leave product names in the internal line.")
    );
    const counts = countLayers(meeting.arc);
    const bal = el("div", { class: "balance" });
    ["Strategic", "Technical", "Impact", "Decision"].forEach((layer) => {
      bal.append(el("span", {}, layer + " " + (counts[layer] || 0)));
    });
    bal.append(el("span", {}, "Total " + meeting.arc.length));
    head.appendChild(bal);
    if (meeting.arc.length > 7) head.append(el("p", { class: "warn" }, "The playbook recommends 5–7. You are carrying more than you will ask. Park the extras."));
    else if (meeting.arc.length >= 5 && counts.Decision >= 1 && counts.Strategic >= 1) head.append(el("p", { class: "ok-note" }, "This arc can be asked in one meeting."));
    else head.append(el("p", { class: "quiet" }, "You still need a strategic opening and a decision question before this is a full arc."));
    const actions = el("div", { class: "row-actions" });
    actions.append(
      button("Build a recommended arc", "primary", buildRecommended),
      button("Go to live notes", "", () => { ui.step = "live"; ui.liveIndex = 0; render(); })
    );
    head.appendChild(actions);
    if (!meeting.focusTopicIds.length) head.append(el("p", { class: "coach" }, "Center a topic in the playbook first. The recommended arc uses that topic plus the " + meeting.role + " role starter."));
    wrap.appendChild(head);
    if (!meeting.arc.length) {
      wrap.append(el("p", { class: "empty panel" }, "The arc is empty. Build a recommended one, or add questions from the playbook."));
      return wrap;
    }
    const list = el("div", { class: "arc-list" });
    meeting.arc.forEach((item, index) => list.appendChild(arcCard(item, index)));
    wrap.appendChild(list);
    return wrap;
  }

  function arcCard(item, index) {
    const card = el("article", { class: "arc-card" });
    card.append(el("div", { class: "seq-no" }, String(index + 1)));
    const body = el("div", {});
    const sourceLabel = item.source === "bank" ? "Question bank" : item.source === "role" ? "Role starter" : "Arc guide";
    body.append(el("div", { class: "meta-row" }, tag(sourceLabel, item.source), tag(item.layer, ""), tag(item.pillar, pillarClass(item.pillar)), el("span", { class: "quiet" }, item.technology || "")));
    body.append(el("p", { class: "q-text", style: "font-size:18px" }, item.question));
    if (item.align) {
      const internal = el("p", { class: "internal" });
      internal.append(el("strong", {}, "Internal only. "), item.align);
      body.appendChild(internal);
    }
    card.appendChild(body);
    const actions = el("div", {});
    actions.append(
      button("Up", "", () => moveArc(index, -1)),
      button("Down", "", () => moveArc(index, 1)),
      button("Remove", "", () => { meeting.arc.splice(index, 1); save(); render(); })
    );
    actions.style.display = "flex";
    actions.style.flexDirection = "column";
    actions.style.gap = "6px";
    card.appendChild(actions);
    return card;
  }

  function moveArc(index, dir) {
    const next = index + dir;
    if (next < 0 || next >= meeting.arc.length) return;
    const [item] = meeting.arc.splice(index, 1);
    meeting.arc.splice(next, 0, item);
    save();
    render();
  }

  function buildRecommended() {
    const topics = meeting.focusTopicIds.map(topicById).filter(Boolean);
    if (!topics.length) {
      toast("Center a topic in the playbook first.");
      ui.step = "playbook";
      render();
      return;
    }
    if (meeting.arc.length && !confirm("Replace the current arc with a recommended 6-question flow?")) return;
    const primary = topics[0];
    const starter = PB.starters.find((s) => s.role === meeting.role && s.seq === 1);
    const strategic = primary.questions.slice();
    const bank = meeting.role === "Superintendent" ? strategic[2] : meeting.role === "CISO" ? strategic[1] : strategic[0];
    const guides = guidesFor(primary);
    const impact = meeting.role === "Superintendent" ? guides[3] : guides[2];
    const decision = guides[4];
    const chosen = [];
    const wrapQ = (q, topic) => Object.assign({ topicId: topic.id, technology: topic.technology, domain: topic.domain }, q);
    if (starter) chosen.push(Object.assign({ domain: "Role starters", technology: "Role opening", topicId: "" }, starter));
    chosen.push(wrapQ(bank, primary));
    if (topics[1]) chosen.push(wrapQ(topics[1].questions[0], topics[1]));
    chosen.push(wrapQ(guides[0], primary));
    if (!topics[1]) chosen.push(wrapQ(guides[1], primary));
    chosen.push(wrapQ(impact, primary));
    chosen.push(wrapQ(decision, primary));
    const trimmed = chosen.slice(0, 7);
    meeting.arc = trimmed.map((q) => ({
      uid: "a_" + Math.random().toString(36).slice(2, 9),
      sourceId: q.id,
      source: q.source,
      topicId: q.topicId || "",
      domain: q.domain || "",
      technology: q.technology || "",
      layer: q.layer,
      pillar: q.pillar,
      role: q.role || "",
      context: q.context || "",
      question: q.question,
      listen: q.listen || "",
      follow: q.follow || "",
      align: q.align || "",
      use: q.use || "",
      evidence: "",
      signals: [],
      unique: false,
      followup: q.follow || ""
    }));
    save();
    toast("Arc ready. Capture what you hear before you draft the prompter.");
    render();
  }

  function viewLive() {
    if (!meeting.arc.length) {
      const empty = el("section", { class: "panel empty" });
      empty.append(el("h2", {}, "Nothing to ask yet"), el("p", {}, "Build an arc first. Live notes follow the questions you committed to ask."), button("Go to the arc", "primary", () => { ui.step = "arc"; render(); }));

    const wrap = el("div", { class: "live" });
    const side = el("aside", { class: "live-side panel" });

    meeting.arc.forEach((q, i) => {
      const heard = q.evidence.trim() || q.signals.length;
      const b = el("button", { class: "jump", type: "button" });

        if (at >= 0) item.signals.splice(at, 1);
        else item.signals.push(signal);
        save();
        render();
      });
      listens.appendChild(b);
    });
    card.appendChild(listens);
    card.appendChild(areaField("What you heard", item.evidence, (v) => { item.evidence = v; save(); }, "Their words, not yours. A sentence is enough."));
    const unique = el("label", { class: "quiet" });

    box.type = "checkbox";
    box.checked = !!item.unique;
    box.addEventListener("change", () => { item.unique = box.checked; save(); });
    unique.append(box, " This is unique to this account");
    card.appendChild(unique);
    card.appendChild(areaField("Next follow-up", item.followup, (v) => { item.followup = v; save(); }));
    if (item.align) {
      const internal = el("p", { class: "internal" });
      internal.append(el("strong", {}, "Keep this unspoken. "), item.align);
      card.appendChild(internal);

      if (ui.liveIndex === meeting.arc.length - 1) ui.step = "prompter";
      else ui.liveIndex += 1;
      render();

    tools.append(button("Draft from this meeting", "primary", () => { draftPrompter(true); render(); toast(meeting.prompter.mode === "grounded" ? "Drafted from their words." : "Hypothesis draft. Confirm it in the room."); }));

    ], "solution"));

    ], "value"));

    );

    }

  function issueBlock(label, key, coach, anxiety) {
    const block = el("label", { class: "issue-block" + (anxiety ? " anxiety" : "") });
    block.append(el("span", { class: "label" }, label));
    const area = document.createElement("textarea");
    area.value = meeting.prompter[key];
    area.addEventListener("input", () => { meeting.prompter[key] = area.value; save(); });
    block.append(area, el("p", { class: "coach" }, coach));
    return block;
  }

  function cell(title, groups, promptKey) {
    const box = el("section", { class: "cell" });
    box.append(el("h3", {}, title));
    groups.forEach(([label, key]) => {
      box.append(el("p", { class: "subhead" }, label));
      const list = meeting.prompter[key];
      list.forEach((value, index) => {
        const row = el("div", { class: "bullet-row" });
        const input = document.createElement("textarea");
        input.rows = 2;
        input.value = value;
        input.setAttribute("aria-label", label + " " + (index + 1));
        const grow = () => {
          input.style.height = "auto";
          input.style.height = Math.max(48, input.scrollHeight) + "px";
        };
        input.addEventListener("input", () => { list[index] = input.value; save(); grow(); });
        requestAnimationFrame(grow);
        const remove = el("button", { type: "button", class: "icon-btn", "aria-label": "Remove " + label }, "×");
        remove.addEventListener("click", () => {
          list.splice(index, 1);
          if (!list.length) list.push("");
          save();
          render();
        });
        row.append(input, remove);
        box.appendChild(row);
      });
      box.append(button("Add", "", () => { list.push(""); save(); render(); }));
    });
    const opc = el("div", { class: "opc" });
    ["open", "probe", "confirm"].forEach((kind) => {
      const open = !!ui.openPrompts[promptKey + kind];
      const b = el("button", { type: "button", "aria-expanded": open ? "true" : "false" }, kind.toUpperCase());
      b.addEventListener("click", () => {
        ui.openPrompts[promptKey + kind] = !ui.openPrompts[promptKey + kind];
        render();
      });
      opc.appendChild(b);
    });
    box.appendChild(opc);
    ["open", "probe", "confirm"].forEach((kind) => {
      if (!ui.openPrompts[promptKey + kind]) return;
      const area = document.createElement("textarea");
      area.value = meeting.prompter.prompts[promptKey][kind];
      area.placeholder = kind === "open" ? "Open question" : kind === "probe" ? "Probe" : "Playback to confirm";
      area.addEventListener("input", () => { meeting.prompter.prompts[promptKey][kind] = area.value; save(); });
      const wrap = el("div", { class: "prompt-box" });
      wrap.append(el("span", { class: "label" }, kind), area);
      box.appendChild(wrap);
    });
    return box;
  }

  function draftPrompter(force) {
    const hasDraft = !!(meeting.prompter.businessIssue || meeting.prompter.mode);
    if (hasDraft && !force) return;
    if (hasDraft && force && !confirm("Replace the current ValuePrompter draft with a new one from your notes?")) return;
    const notes = evidenceSentences();
    const grounded = notes.length >= 2 || meeting.arc.some((a) => a.signals.length && a.evidence.trim());
    const mode = notes.length ? (grounded ? "grounded" : "hypothesis") : "hypothesis";
    const topics = focusedOrArcTopics();
    const window = shortWindow(meeting.triggers, meeting.segment);
    const p = blankPrompter();
    p.mode = mode;
    p.contact = [meeting.contactName, meeting.contactTitle].filter(Boolean).join(", ");
    p.businessIssue = draftIssue(notes, window);
    p.anxiety = draftAnxiety(notes, window);
    if (mode === "grounded") {
      const story = notes.filter((n) => n.layer !== "Decision");
      const decisions = notes.filter((n) => n.layer === "Decision");
      const unique = story.filter((n) => n.unique || looksUnique(n.text));
      const plain = story.filter((n) => !unique.includes(n));
      p.problems = nonempty(plain.map((n) => n.text));
      p.uniqueProblems = nonempty(unique.map((n) => n.text));
      if (p.problems.length === 1 && p.problems[0] === "") p.problems = signalBullets().slice(0, 4);
      p._decisions = decisions;
      p.solutions = solutionLines(topics);
      p.uniqueSolutions = [uniqueSolution(topics, window)];
      p.businessValue = valueLines();
      p.uniqueValue = unique.length ? ["The value only they described: " + unique[0].text] : ["Capture the outcome that is specific to this account, in their metric."];
      p.personalValue = [personalLine()];
    } else {
      p.problems = hypothesisProblems();
      p.uniqueProblems = ["Ask what is true here that would not be true in a neighboring district, city, or campus."];
      p.solutions = ["Leave this blank until they describe the gap. Then write the capability they asked for."];
      p.uniqueSolutions = ["Wait for a detail only this account would say."];
      p.businessValue = valueLines();
      p.uniqueValue = ["Unknown until they name a measure that matters here."];
      p.personalValue = [personalLine()];
    }
    p.players = playerLines();
    p.events = eventLines(window);
    (p._decisions || []).slice(0, 2).reverse().forEach((n) => p.events.unshift(n.text.replace(/\.$/, "")));
    p.events = p.events.slice(0, 6);
    delete p._decisions;
    p.prompts = promptLines(notes);
    p.internal = internalLines(topics);
    meeting.prompter = cleanLists(p);
    ["problem", "solution", "value", "power", "plan"].forEach((k) => { ui.openPrompts[k + "confirm"] = true; });
    save();
  }

  function cleanLists(p) {
    ["problems", "uniqueProblems", "solutions", "uniqueSolutions", "businessValue", "uniqueValue", "personalValue", "players", "events"].forEach((k) => {
      const filled = (p[k] || []).map((s) => (s || "").trim()).filter(Boolean);
      p[k] = filled.length ? filled : [""];
    });
    return p;
  }

  function evidenceSentences() {
    const out = [];
    meeting.arc.forEach((item) => {
      const text = (item.evidence || "").trim();
      if (!text) return;
      text.split(/(?<=[.!?])\s+/).forEach((part) => {
        const clean = part.trim();
        if (clean) out.push({ text: ensurePeriod(clean), unique: !!item.unique, layer: item.layer, pillar: item.pillar });
      });
    });
    return out;
  }

  function signalBullets() {
    const set = [];
    meeting.arc.forEach((item) => item.signals.forEach((s) => { if (!set.includes(s)) set.push(s); }));
    return set;
  }

  function draftIssue(notes, window) {
    const who = meeting.account || "This account";
    const outcome = (meeting.outcome || "").trim().replace(/[.\s]+$/, "");
    const heard = notes[0] ? notes[0].text : "";
    if (outcome && heard) return who + " needs " + needPhrase(outcome) + ". In their words: " + heard;
    if (outcome) return who + " needs " + needPhrase(outcome) + ".";
    if (heard) return who + " is up against " + window + ". In their words: " + heard;
    const topics = focusedOrArcTopics().map((t) => t.technology).join(" and ");
    return "Hypothesis: " + who + " needs a defensible plan" + (topics ? " for " + topics : "") + " before " + window + ".";
  }

  function draftAnxiety(notes, window) {
    if (notes[0]) return "If that is still true at " + window + ", what will you have to explain to finance, elected leadership, or the community?";
    return "If nothing changes before " + window + ", what becomes harder to defend to finance, elected leadership, or the community?";
  }

  function hypothesisProblems() {
    const fromSignals = signalBullets();
    if (fromSignals.length) return fromSignals.map((s) => "Test whether this is true: " + lowerFirst(s) + ".");
    const topic = focusedOrArcTopics()[0];
    if (!topic) return ["Ask which problem is funding-worthy before the next window, and what evidence they trust."];
    return [
      "Test whether priorities for " + topic.capability + " still follow the last incident rather than a shared baseline.",
      "Test whether " + topic.accountability + " have a real owner, or only a policy.",
      "Test whether " + topic.personas + " get the same experience."
    ];
  }

  function solutionLines(topics) {
    const lines = [];
    topics.forEach((t) => {
      lines.push("A shared picture of " + t.capability + " across " + t.scope + ".");
      lines.push("A named owner for " + t.accountability + ", with exceptions that expire.");
    });
    return lines.slice(0, 4);
  }

  function uniqueSolution(topics, window) {
    const cap = topics[0] ? topics[0].capability : "the gap they named";
    const who = firstName() || "the sponsor";
    return "Evidence of " + cap + " that " + who + " can defend at " + window + ".";
  }

  function valueLines() {
    const pillars = new Set(meeting.arc.map((a) => a.pillar));
    const lines = [];
    if (pillars.has("Visibility")) lines.push("Decisions from a shared picture of health and risk, not the last incident.");
    if (pillars.has("Control")) lines.push("Policy and exceptions that have an owner and can be shown.");
    if (pillars.has("Resilience")) lines.push("Less downtime, and a recovery path tested before it is public.");
    if (pillars.has("User Experience")) lines.push("A service that holds up across sites, not only where someone shouts.");
    const segmentLine = {
      State: "Citizen services and agency work that stay up, and a story the cabinet can defend.",
      Local: "Constituent access and public safety that do not depend on which building you are in.",
      "K-12": "Instructional time and student safety held when the network is under pressure.",
      "Higher Education": "Academic continuity and a campus experience that research and teaching can trust."
    }[meeting.segment];
    if (segmentLine) lines.push(segmentLine);
    if (!lines.length) lines.push("Less risk, a defensible cost, and trust that the service is fair.");
    return lines;
  }

  function personalLine() {
    const name = firstName() || "They";
    const lines = {
      CIO: name + " can defend the spend without a surprise finding, and fewer cross-department escalations land on their desk.",
      CISO: name + " can show the control continuously, and owns fewer exceptions that have no expiration.",
      "Network Director": name + " spends less time in ticket ping-pong, and the refresh matches the workload the team can actually run.",
      Superintendent: name + " can talk about instructional time and family trust, not a hardware list, when the board asks."
    };
    return lines[meeting.role] || name + " looks prepared to the people who fund this and to the people who feel it.";
  }

  function playerLines() {
    const lines = [];
    if (meeting.contactName) lines.push(meeting.contactName + (meeting.contactTitle ? ", " + meeting.contactTitle : "") + " — in the room");
    const extras = {
      State: ["Finance or budget officer — confirm", "Cabinet sponsor — confirm", "Procurement — confirm", "Security lead — confirm"],
      Local: ["City or county manager — confirm", "Finance director — confirm", "Procurement — confirm", "Public safety lead — confirm"],
      "K-12": ["Superintendent — confirm", "E-rate or grants coordinator — confirm", "Finance director — confirm", "Principals who approve exceptions — confirm", "Network lead — confirm"],
      "Higher Education": ["Academic sponsor — confirm", "CFO — confirm", "Procurement — confirm", "CISO — confirm"]
    }[meeting.segment] || [];
    extras.forEach((e) => {
      if (!meeting.contactTitle || e.toLowerCase().indexOf(meeting.contactTitle.toLowerCase().split(" ")[0]) === -1) lines.push(e);
    });
    return lines.slice(0, 6);
  }

  function eventLines(window) {
    const base = [
      "Playback of this meeting — date to confirm",
      "Working session with the operator who lives the exception — date to confirm",
      "Evidence readout before " + window + " — date to confirm"
    ];
    if (meeting.triggers.includes("Grant")) base.push("Grant or E-rate narrative lock — date to confirm");
    if (meeting.triggers.includes("Audit")) base.push("Audit evidence request — date to confirm");
    if (meeting.triggers.includes("Incident")) base.push("After-action with leadership — date to confirm");
    if (meeting.triggers.includes("Refresh") || meeting.triggers.includes("Aging infrastructure")) base.push("Lifecycle or procurement milestone — date to confirm");
    return base.slice(0, 5);
  }

  function promptLines(notes) {
    const by = (layer) => meeting.arc.find((a) => a.layer === layer);
    const strategic = by("Strategic");
    const technical = by("Technical");
    const impact = by("Impact");
    const decision = by("Decision");
    const control = meeting.arc.find((a) => a.pillar === "Control" && a.layer === "Strategic") || strategic;
    const playback = notes[0] ? "What I hear is: " + notes[0].text + " Did I get that right?" : "Play back their words before you move on.";
    return {
      problem: {
        open: (technical || strategic || {}).question || "Where does this break down today?",
        probe: (technical || strategic || {}).followup || "What do people do when that picture is missing?",
        confirm: playback
      },
      solution: {
        open: "When this is working, what can the people who feel it most do that they cannot do today?",
        probe: "What would you need to see to believe that was real, not only promised?",
        confirm: "So the capability you actually need is the one you just described. Did I hear it correctly?"
      },
      value: {
        open: (impact || {}).question || "What does this cost when it fails — in time, equity, trust, or money?",
        probe: (impact || {}).followup || "How does that show up in risk, cost, compliance, downtime, or community trust?",
        confirm: notes[1] ? "The impact I heard is: " + notes[1].text + " Is that the one that matters?" : playback
      },
      power: {
        open: (control || {}).question || "Who owns the decision, and who can stall it?",
        probe: "Who can say yes, who can stall it, and who lives with the exception?",
        confirm: meeting.contactName ? "You are central to this, and we still need to confirm who else must be comfortable. Is that fair?" : "Confirm the names before you leave."
      },
      plan: {
        open: (decision || {}).question || "What evidence and what date make this decision real?",
        probe: (decision || {}).followup || "What date is real, and what has to be true before it?",
        confirm: "The next dated step we both put on the mutual plan is the one we just named."
      }
    };
  }

  function internalLines(topics) {
    const lines = [];
    const seen = {};
    topics.forEach((t) => {
      if (t.alignment && !seen[t.alignment]) {
        seen[t.alignment] = true;
        lines.push(t.technology + ": " + t.alignment);
      }
    });
    meeting.arc.forEach((a) => {
      if (a.align && !seen[a.align]) {
        seen[a.align] = true;
        lines.push((a.technology || a.layer) + ": " + a.align);
      }
    });
    return lines;
  }

  function focusedOrArcTopics() {
    const ids = meeting.focusTopicIds.slice();
    meeting.arc.forEach((a) => { if (a.topicId && ids.indexOf(a.topicId) === -1) ids.push(a.topicId); });
    return ids.map(topicById).filter(Boolean).slice(0, 2);
  }

  function looksUnique(text) {
    return /e-rate|grant|bond|school by school|equit/i.test(text);
  }

  function customerText() {
    const p = meeting.prompter;
    const lines = [];
    lines.push((meeting.account || "Account") + " — ValuePrompter notes");
    if (p.mode === "hypothesis") lines.push("HYPOTHESIS — confirm in the meeting before you treat this as fact.");
    lines.push("");
    lines.push("Contact: " + p.contact);
    lines.push("Business issue: " + p.businessIssue);
    lines.push("Anxiety question: " + p.anxiety);
    lines.push("");
    appendList(lines, "Problems", p.problems);
    appendList(lines, "Unique problems", p.uniqueProblems);
    appendList(lines, "Solutions", p.solutions);
    appendList(lines, "Unique solutions", p.uniqueSolutions);
    appendList(lines, "Business value", p.businessValue);
    appendList(lines, "Unique value", p.uniqueValue);
    appendList(lines, "Personal value", p.personalValue);
    appendList(lines, "Power — key players", p.players);
    appendList(lines, "Plan — events and dates", p.events);
    lines.push("");
    ["problem", "solution", "value", "power", "plan"].forEach((k) => {
      const pr = p.prompts[k];
      lines.push(k.toUpperCase());
      lines.push("Open: " + pr.open);
      lines.push("Probe: " + pr.probe);
      lines.push("Confirm: " + pr.confirm);
      lines.push("");
    });
    return lines.join("\n");
  }

  function internalText() {
    const extra = ["", "INTERNAL ALIGNMENT — do not lead with this", ""].concat(meeting.prompter.internal || []);
    return customerText() + "\n" + extra.join("\n");
  }

  function appendList(lines, title, items) {
    lines.push(title);
    (items || []).filter((s) => (s || "").trim()).forEach((s) => lines.push("• " + s));
    lines.push("");
  }

  function copyText(text, message) {
    const done = () => toast(message);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }

  function fallbackCopy(text, done) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    done();
  }

  function loadSample() {
    const topic = topicById("networking-wireless-mobility");
    if (!topic) return;
    meeting.account = "Rivergate Unified School District";
    meeting.segment = "K-12";
    meeting.contactName = "Elena Vasquez";
    meeting.contactTitle = "Chief Technology Officer";
    meeting.role = "CIO";
    meeting.triggers = ["Grant", "Aging infrastructure", "Downtime"];
    meeting.outcome = "Keep instruction and campus safety online across every school through the next E-rate cycle";
    meeting.meetingDate = "2026-10-08";
    meeting.accountNotes = "Two elementaries lost a testing morning last spring. The new STEM campus did not. Board has asked about equity.";
    meeting.focusTopicIds = [topic.id];
    const q1 = topic.questions[0];
    const q2 = topic.questions[1];
    const guides = guidesFor(topic);
    const specs = [
      [q1, "Refresh decisions still follow whichever school shouted loudest after an outage. There is no shared baseline of classroom experience. E-rate is the only funding path large enough for a district-wide refresh, and that window is this winter.", ["Priorities based on incidents rather than evidence", "grant dependence", "no shared baseline"], true],
      [q2, "RF standards sit with the network team, but guest and filtering exceptions are approved school by school. She cannot say who accepts the risk when a principal overrides the rule.", ["decentralized exceptions", "responsibility gaps"], true],
      [guides[0], "Classroom tickets bounce between the wireless tech, the student-system owner, and the ISP. During testing they cannot tell a bad access point from a bad upstream path.", ["Swivel-chair tools", "no shared baseline"], false],
      [guides[2], "A testing-week outage at two campuses cost a full morning of instruction and a board question about equity between the new STEM campus and older elementaries.", ["equity gaps between sites", "downtime that becomes a public story"], true],
      [guides[4], "She needs a one-page story for the board that shows experience by campus, not a hardware list. The filing deadline is early January.", ["Anecdotes", "a decision that cannot be shown to finance or a board"], false]
    ];
    meeting.arc = specs.map(([q, evidence, signals, unique]) => ({
      uid: "a_" + Math.random().toString(36).slice(2, 9),
      sourceId: q.id,
      source: q.source,
      topicId: topic.id,
      domain: topic.domain,
      technology: topic.technology,
      layer: q.layer,
      pillar: q.pillar,
      role: q.role || "",
      context: q.context || "",
      question: q.question,
      listen: q.listen || "",
      follow: q.follow || "",
      align: q.align || topic.alignment,
      use: q.use || "",
      evidence: evidence,
      signals: signals,
      unique: unique,
      followup: q.follow || ""
    }));
    meeting.prompter = blankPrompter();
    save();
    ui.step = "live";
    ui.liveIndex = 0;
    toast("Rivergate walkthrough loaded. These notes are an example.");
    render();
  }

  function deleteMeeting() {
    if (!confirm("Delete this meeting from this browser?")) return;
    store.meetings = store.meetings.filter((m) => m.id !== meeting.id);
    meeting = store.meetings[0] || blankMeeting();
    if (!store.meetings.length) store.meetings.push(meeting);
    save();
    ui.step = "brief";
    render();
  }

  function countLayers(arc) {
    const counts = {};
    arc.forEach((a) => { counts[a.layer] = (counts[a.layer] || 0) + 1; });
    return counts;
  }

  function shortWindow(triggers, segment) {
    return windowPhrase((triggers || []).slice(0, 1), segment);
  }

  function windowPhrase(triggers, segment) {
    const map = {
      "Fiscal cycle": "the next budget lock",
      Grant: segment === "K-12" ? "the next E-rate or grant filing" : "the next grant window",
      Audit: "the next audit or evidence request",
      Incident: "the next incident review",
      Refresh: "the refresh date",
      Staffing: "the point where this team cannot take on another tool",
      Downtime: "the next outage that reaches the community",
      "Public trust": "the next board or public briefing",
      Compliance: "the next compliance review",
      "Aging infrastructure": "the lifecycle date on the gear carrying this service"
    };
    const parts = (triggers || []).map((t) => map[t]).filter(Boolean);
    if (!parts.length) return segment === "K-12" ? "the next board or E-rate window" : "the next decision window";
    if (parts.length === 1) return parts[0];
    return parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1];
  }

  function firstName() {
    const n = (meeting.contactName || "").trim().split(" ")[0];
    return n;
  }

  function lowerFirst(s) {
    if (!s) return s;
    return s.charAt(0).toLowerCase() + s.slice(1);
  }

  function needPhrase(outcome) {
    const text = outcome.trim().replace(/[.\s]+$/, "");
    if (/^(to|a|an|the)\b/i.test(text)) return lowerFirst(text);
    return "to " + lowerFirst(text);
  }

  function ensurePeriod(s) {
    return /[.!?]$/.test(s) ? s : s + ".";
  }

  function nonempty(list) {
    const filled = list.map((s) => (s || "").trim()).filter(Boolean);
    return filled.length ? filled : [""];
  }

  function splitListen(text) {
    return (text || "").split(";").map((s) => s.trim()).filter(Boolean);
  }

  function field(label, type, value, oninput, placeholder) {
    const wrap = el("label", { class: "field" });
    wrap.append(el("span", {}, label));
    const input = document.createElement("input");
    input.type = type;
    input.value = value || "";
    if (placeholder) input.placeholder = placeholder;
    input.addEventListener("input", () => oninput(input.value));
    wrap.appendChild(input);
    return wrap;
  }

  function areaField(label, value, oninput, placeholder) {
    const wrap = el("label", { class: "field" });
    wrap.append(el("span", {}, label));
    const area = document.createElement("textarea");
    area.value = value || "";
    if (placeholder) area.placeholder = placeholder;
    area.addEventListener("input", () => oninput(area.value));
    wrap.appendChild(area);
    return wrap;
  }

  function pillField(label, options, current, onpick) {
    const wrap = el("div", { class: "field" });
    wrap.append(el("span", {}, label));
    const row = el("div", { class: "pills", role: "group", "aria-label": label });
    options.forEach((opt) => {
      const b = el("button", { type: "button", class: "pill", "aria-pressed": opt === current ? "true" : "false" }, opt);
      b.addEventListener("click", () => onpick(opt));
      row.appendChild(b);
    });
    wrap.appendChild(row);
    return wrap;
  }

  function multiField(label, options, current, onchange) {
    const wrap = el("div", { class: "field" });
    wrap.append(el("span", {}, label));
    const row = el("div", { class: "pills", role: "group", "aria-label": label });
    options.forEach((opt) => {
      const pressed = current.includes(opt);
      const b = el("button", { type: "button", class: "pill", "aria-pressed": pressed ? "true" : "false" }, opt);
      b.addEventListener("click", () => {
        const next = current.slice();
        const i = next.indexOf(opt);
        if (i >= 0) next.splice(i, 1);
        else next.push(opt);
        onchange(next);
        render();
      });
      row.appendChild(b);
    });
    wrap.appendChild(row);
    return wrap;
  }

  function selectFilter(label, options, current, onchange) {
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", label);
    options.forEach((opt) => {
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = label + ": " + opt;
      if (opt === current) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", () => { onchange(sel.value); render(); });
    return sel;
  }

  function button(label, kind, onclick) {
    const b = el("button", { type: "button", class: "btn" + (kind ? " " + kind : "") }, label);
    if (kind === "primary") b.classList.add("primary");
    b.addEventListener("click", onclick);
    return b;
  }

  function tag(text, cls) {
    return el("span", { class: "tag" + (cls ? " " + cls : "") }, text);
  }

  function el(tagName, attrs) {
    const node = document.createElement(tagName);
    const kids = Array.prototype.slice.call(arguments, 2);
    Object.keys(attrs || {}).forEach((k) => {
      if (k === "class") node.className = attrs[k];
      else if (attrs[k] != null) node.setAttribute(k, attrs[k]);
    });
    kids.flat().forEach((kid) => {
      if (kid == null || kid === false) return;
      node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
    return node;
  }
})();
